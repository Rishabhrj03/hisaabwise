<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Soft Blue for Wallet -->
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" /> <!-- Blue 400 -->
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" /> <!-- Blue 600 -->
    </linearGradient>
     <!-- Inner Shadow for depth -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    
    <!-- Pink for Brain -->
    <linearGradient id="softPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>

    <!-- Green for Graph -->
    <linearGradient id="softGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>

    <!-- Gold for Money -->
    <linearGradient id="softGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- "The Graph": Rising Pillars behind -->
  <rect x="50" y="40" width="25" height="80" rx="10" fill="url(#softGreen)" />
  <rect x="90" y="20" width="25" height="100" rx="10" fill="url(#softGreen)" />
  <rect x="130" y="50" width="25" height="70" rx="10" fill="url(#softGreen)" />

  <!-- "The Mind": A Brain Cloud shape behind the wallet -->
  <path d="M40 80 Q 20 80 20 100 Q 20 130 50 130 L 150 130 Q 180 130 180 100 Q 180 80 160 80 Q 140 60 100 60 Q 60 60 40 80" 
        fill="url(#softPink)" opacity="0.9" />

  <!-- "The Wallet": Soft rounded container in front -->
  <rect x="30" y="90" width="140" height="90" rx="20" fill="url(#softBlue)" filter="drop-shadow(0 10px 10px rgba(0,0,0,0.2))" />
  
  <!-- Wallet Flap -->
  <path d="M30 110 H 170" stroke="white" stroke-width="4" stroke-opacity="0.2" stroke-linecap="round" />

  <!-- "The Money": 3D Floating Coin in front -->
  <circle cx="140" cy="150" r="25" fill="url(#softGold)" filter="drop-shadow(0 5px 5px rgba(0,0,0,0.2))" />
  <text x="140" y="160" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">₹</text>
  
  <!-- Sparkles for 'Magic/Mind' -->
  <circle cx="170" cy="50" r="5" fill="white" />
  <text x="165" y="55" font-size="10" fill="#f472b6">✨</text>

</svg>
