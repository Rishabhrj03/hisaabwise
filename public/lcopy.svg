<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Deep Space Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>

    <!-- Neon Circuit Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" /> <!-- Sky Blue -->
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" /> <!-- Indigo -->
    </linearGradient>

    <!-- Success Graph Gradient -->
    <linearGradient id="graphGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#bgGrad)" />
  
  <!-- "The Wallet": A stylised outline with a gap at top -->
  <path d="M50 70 V 140 A 20 20 0 0 0 70 160 H 130 A 20 20 0 0 0 150 140 V 70" 
        stroke="url(#neonGrad)" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- "The Mind": Circuit connections inside the wallet -->
  <circle cx="70" cy="130" r="5" fill="#38bdf8" />
  <circle cx="100" cy="140" r="5" fill="#38bdf8" />
  <circle cx="130" cy="130" r="5" fill="#38bdf8" />
  <path d="M70 130 L 100 110 L 130 130" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.6" />
  <path d="M100 140 V 110" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.6" />

  <!-- "The Money": Gold Coins stacking -->
  <ellipse cx="100" cy="110" rx="20" ry="8" fill="#d97706" />
  <ellipse cx="100" cy="105" rx="20" ry="8" fill="#f59e0b" />
  <ellipse cx="100" cy="100" rx="20" ry="8" fill="#fbbf24" stroke="#fece55" stroke-width="2" />

  <!-- "The Graph": Explosive growth coming OUT of the wallet -->
  <path d="M40 90 L 70 90 L 90 60 L 120 70 L 160 30" 
        stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" 
        filter="drop-shadow(0 0 4px #4ade80)"/>
  
  <!-- Arrow Head -->
  <path d="M130 30 H 160 V 60" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

</svg>
